name: Build Samsung A03s Kernel

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag rilis source di GitHub Releases"
        required: true
        default: "source-v1"
      archive_name:
        description: "Nama file arsip source di Release"
        required: true
        default: "Kernel.tar.gz"
      defconfig:
        description: "Nama defconfig target"
        required: true
        default: "a03s_defconfig"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git libssl-dev \
            libelf-dev dwarves python3 python-is-python3 zip unzip \
            lz4 xz-utils zstd ca-certificates file

      - name: Download and extract kernel source
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          FILE: ${{ inputs.archive_name }}
        run: |
          mkdir -p archive_tmp kernel_src toolchain
          gh release download "$TAG" -R "${{ github.repository }}" -p "$FILE" -D archive_tmp
          tar -xf "archive_tmp/$FILE" -C kernel_src

      - name: Download prebuilt Clang r383902 and GCC 4.9
        run: |
          mkdir -p kernel_src/toolchain/clang/host/linux-x86 \
                   kernel_src/toolchain/gcc/linux-x86/aarch64

          if ! git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/android-clang-r383902 \
            kernel_src/toolchain/clang/host/linux-x86/clang-r383902; then
            echo "android-clang-r383902 tidak ditemukan, mencoba clang-r383902..."
            git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/clang-r383902 \
              kernel_src/toolchain/clang/host/linux-x86/clang-r383902 || true
          fi

          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            kernel_src/toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 || true

          ls -la kernel_src/toolchain/clang/host/linux-x86/clang-r383902/bin 2>/dev/null || true
          ls -la kernel_src/toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin 2>/dev/null || true

      - name: Compile kernel
        env:
          DEFCONFIG: ${{ inputs.defconfig }}
        run: |
          cd kernel_src
          export ARCH=arm64
          export SUBARCH=arm64

          CLANG_BIN="$(pwd)/toolchain/clang/host/linux-x86/clang-r383902/bin"
          GCC_BIN="$(pwd)/toolchain/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin"

          if [ -x "$CLANG_BIN/clang" ]; then
            export CC="$CLANG_BIN/clang"
            export PATH="$CLANG_BIN:$PATH"
          else
            sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld llvm
            export CC="clang"
          fi

          if [ -x "$GCC_BIN/aarch64-linux-androidkernel-ld" ]; then
            export CROSS_COMPILE="$GCC_BIN/aarch64-linux-androidkernel-"
            export PATH="$GCC_BIN:$PATH"
          elif command -v aarch64-linux-gnu-gcc >/dev/null 2>&1; then
            export CROSS_COMPILE="aarch64-linux-gnu-"
          else
            sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu
            export CROSS_COMPILE="aarch64-linux-gnu-"
          fi

          export CLANG_TRIPLE="aarch64-linux-gnu-"

          make -C "$(pwd)" O="$(pwd)/out" KCFLAGS=-w CONFIG_SECTION_MISMATCH_WARN_ONLY=y "$DEFCONFIG"
          make -C "$(pwd)" O="$(pwd)/out" KCFLAGS=-w CONFIG_SECTION_MISMATCH_WARN_ONLY=y -j"$(nproc)"
          ls -lh out/arch/arm64/boot/

      - name: Upload kernel image artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a03s-kernel-out
          path: |
            kernel_src/out/arch/arm64/boot/Image*
            kernel_src/out/arch/arm64/boot/dts/mediatek/*.dtb*
          if-no-files-found: warn
