name: Extract Source from GitHub Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag rilis di GitHub Releases (contoh: source-v1)"
        required: true
        default: "source-v1"
      archive_name:
        description: "Nama file arsip di Release (contoh: Kernel.tar.gz)"
        required: true
        default: "Kernel.tar.gz"

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          FILE: ${{ inputs.archive_name }}
        run: |
          mkdir -p archive_tmp kernel_src
          gh release download "$TAG" -R "${{ github.repository }}" -p "$FILE" -D archive_tmp
          ls -lh archive_tmp

      - name: Extract archive in Linux runner
        env:
          FILE: ${{ inputs.archive_name }}
        run: |
          tar -xf "archive_tmp/$FILE" -C kernel_src

          # Jika di dalamnya masih terdapat arsip .tar / .tar.gz / .tar.xz tambahan:
          find kernel_src -maxdepth 2 -name "*.tar*" -exec sh -c '
            for f do
              target_dir="${f%.tar*}"
              mkdir -p "$target_dir"
              tar -xf "$f" -C "$target_dir"
            done
          ' sh {} +

          ls -la kernel_src

      - name: Inspect build script, defconfig, KSU-Next, and SUSFS
        run: |
          echo "=== build_kernel.sh ==="
          cat kernel_src/build_kernel.sh || true

          echo "=== build.config.mtk.aarch64 ==="
          cat kernel_src/build.config.mtk.aarch64 || true

          echo "=== Matching defconfigs ==="
          ls kernel_src/arch/arm64/configs/ | grep -iE "a03|mt6765|k65|mtk" || true

          echo "=== Check KSU-Next & SUSFS ==="
          find kernel_src -maxdepth 3 -iname "*ksu*" -o -iname "*susfs*" || true
          grep -rn "CONFIG_KSU" kernel_src/drivers/ kernel_src/fs/ kernel_src/security/ 2>/dev/null | head -n 20 || true
          grep -rn "CONFIG_KSU_SUSFS" kernel_src/fs/ kernel_src/kernel/ 2>/dev/null | head -n 20 || true
